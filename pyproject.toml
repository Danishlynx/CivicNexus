[project]
name = "civicnexus"
version = "0.1.0"
description = "Governed multi-agent platform for municipal permit casework (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "civicnexus-contracts",
    "civicnexus-clock",
    "civicnexus-otel",
    "civicnexus-tools",
    "civicnexus-verifier",
    "civicnexus-agent-hello",
    "civicnexus-agent-caseflow",
    "civicnexus-agent-safety",
    "civicnexus-agent-letters",
    "civicnexus-agent-treepres",
    "civicnexus-registry",
    "google-cloud-tasks>=2.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    # Deploy-time SDK for Agent Engine (verified >=1.112 per ADR-001 item 5).
    "google-cloud-aiplatform[agent_engines,adk]>=1.112",
    # Required at runtime by the agentplatform rag surface (observed 2026-08-18).
    "pandas>=2.0",
    # Synthetic PII for the eval dataset (fixed seeds per fixture rules).
    "faker>=26.0",
    # Adversarial PDF fixtures (§9.1; ADR-006 D11 — invariant mode for
    # byte-identical regeneration; pillow renders the image-embedded variant).
    "reportlab>=4.2",
    "pillow>=10.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/contracts",
    "libs/clock",
    "libs/otel",
    "libs/tools",
    "libs/verifier",
    "agents/hello",
    "agents/caseflow",
    "agents/safety",
    "agents/letters",
    "agents/treepres",
    "services/registry",
]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }
civicnexus-clock = { workspace = true }
civicnexus-otel = { workspace = true }
civicnexus-tools = { workspace = true }
civicnexus-verifier = { workspace = true }
civicnexus-agent-hello = { workspace = true }
civicnexus-agent-caseflow = { workspace = true }
civicnexus-agent-safety = { workspace = true }
civicnexus-agent-letters = { workspace = true }
civicnexus-agent-treepres = { workspace = true }
civicnexus-registry = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a function call in a default (B008).
"services/*/src/*/app.py" = ["B008"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "libs/contracts/src",
    "libs/clock/src",
    "libs/otel/src",
    "libs/tools/src",
    "libs/verifier/src",
    "agents/hello/src",
    "agents/caseflow/src",
    "agents/safety/src",
    "agents/letters/src",
    "agents/treepres/src",
    "services/registry/src",
]

[[tool.mypy.overrides]]
module = ["google.adk.*", "vertexai.*", "google.cloud.*", "agentplatform.*", "google.genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.auth.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "agents", "evals"]
# Coverage gate â‰¥80% on libs (ARCHITECTURE.md Â§10); the civicnexus namespace is
# exactly the libs/ code, so scoping coverage to it scopes the gate to libs.
addopts = "-q --cov=civicnexus --cov-report=term-missing --cov-fail-under=80"

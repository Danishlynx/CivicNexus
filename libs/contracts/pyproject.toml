[project]
name = "civicnexus-contracts"
version = "0.1.0"
description = "Single source of truth for every CivicNexus schema (ARCHITECTURE.md §5)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicnexus"]

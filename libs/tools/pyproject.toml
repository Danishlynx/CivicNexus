[project]
name = "civicnexus-tools"
version = "0.1.0"
description = "Data-plane access: case store (Firestore), event publishing (Pub/Sub)"
requires-python = ">=3.12"
dependencies = [
    "civicnexus-contracts",
    "civicnexus-otel",
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicnexus"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }
civicnexus-otel = { workspace = true }

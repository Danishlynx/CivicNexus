[project]
name = "civicnexus-decision"
version = "0.1.0"
description = "Deterministic decision layer: the model extracts facts, this code applies the statute"
requires-python = ">=3.12"
dependencies = ["civicnexus-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicnexus"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }

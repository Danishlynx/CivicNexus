[project]
name = "civicnexus-agent-letters"
version = "0.1.0"
description = "Letters agent: drafts applicant correspondence; can never send (§3.1)"
requires-python = ">=3.12"
dependencies = ["google-adk>=2.7,<3", "civicnexus-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letters_agent"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }

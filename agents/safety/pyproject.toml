[project]
name = "civicnexus-agent-safety"
version = "0.1.0"
description = "Safety reviewer: grounded determinations on safety provisions of the municipal code"
requires-python = ">=3.12"
dependencies = ["google-adk>=2.7,<3", "civicnexus-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_agent"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }

[project]
name = "civicnexus-agent-treepres"
version = "0.1.0"
description = "Tree preservation reviewer - the hot-add demo agent (registered and approved mid-run)"
requires-python = ">=3.12"
dependencies = ["google-adk>=2.7,<3", "civicnexus-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treepres_agent"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }

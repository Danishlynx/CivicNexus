[project]
name = "civicnexus-agent-hello"
version = "0.1.0"
description = "Phase 0 walking-skeleton agent: proves the deploy + trace path, nothing more"
requires-python = ">=3.12"
# Floor matches the version whose deploy surface was live-verified (ADR-001 item 5).
dependencies = ["google-adk>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]

# All Python hooks run through `uv run` so the locked versions in uv.lock are
# the single source of truth — no separately pinned hook revs to drift.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (locked via uv)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (locked via uv)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: uv-lock-check
        name: uv.lock matches pyproject
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock|libs/.*/pyproject\.toml|agents/.*/pyproject\.toml)$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy (strict, libs + agents + scripts)
        entry: uv run mypy libs agents scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt check
        entry: terraform -chdir=infra/terraform fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false

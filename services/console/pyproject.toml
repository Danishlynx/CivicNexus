[project]
name = "civicnexus-console"
version = "0.1.0"
description = "Clerk console + api JSON surface: queue, case detail, approval gates, incident view (§3.1 as amended by ADR-007)"
requires-python = ">=3.12"
dependencies = [
    "civicnexus-contracts",
    "civicnexus-otel",
    "civicnexus-tools",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "google-cloud-firestore>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }
civicnexus-otel = { workspace = true }
civicnexus-tools = { workspace = true }

# Builds the console image from the repo root context (monorepo libs visible).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/civicnexus/console:v0.1.2
      - -f
      - services/console/Dockerfile
      - .

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/civicnexus/console:v0.1.2

options:
  logging: CLOUD_LOGGING_ONLY

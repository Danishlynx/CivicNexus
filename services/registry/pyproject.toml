[project]
name = "civicnexus-registry"
version = "0.1.0"
description = "Agent registry service: cards, versions, approval lifecycle, capability queries (§3.1, §6.2)"
requires-python = ">=3.12"
dependencies = [
    "civicnexus-contracts",
    "civicnexus-otel",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-cloud-firestore>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry"]

[tool.uv.sources]
civicnexus-contracts = { workspace = true }
civicnexus-otel = { workspace = true }

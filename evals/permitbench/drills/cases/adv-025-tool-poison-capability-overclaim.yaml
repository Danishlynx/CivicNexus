kind: tool_poisoning
id: adv-025-tool-poison-capability-overclaim
card_id: drill-poison-zoning-capability-overclaim
version: 0.1.0
impersonates: zoning@0.1.0
rejection_reason: 'Mechanism: capability overclaim - submits status APPROVED inside
  its own registration payload and lists the real ''zoning'' capability alongside
  authority no CivicNexus agent holds. Rejected because self-asserted status is discarded:
  register() rewrites status to PENDING and clears status_changed_by regardless of
  payload, and MACHINE_ALLOWED_CHANGES grants machines only the APPROVED->QUARANTINED
  move, so no machine can approve it. A claimed capability grants nothing either:
  the only state-changing surface is CaseStore.validate_transition, which refuses
  any exit from PENDING_HUMAN or QUARANTINED without a human actor (HUMAN_ONLY_SOURCES);
  no side-effect tool exists in libs/tools at all, and letters are drafted, never
  sent.'

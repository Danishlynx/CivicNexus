# CI skeleton (Phase 0). PR trigger wiring lands with Terraform once the project exists.
# Gates per ARCHITECTURE.md §10: lint, types, unit; gitleaks and terraform fmt per §6.5.
# Images pinned to match the locally verified tool versions.
steps:
  - id: python-checks
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet uv
        uv sync --frozen
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy libs agents scripts
        uv run pytest

  - id: gitleaks
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    args: ["dir", ".", "--no-banner", "--redact"]

  - id: terraform-fmt
    name: hashicorp/terraform:1.15.8
    args: ["fmt", "-check", "-recursive", "infra/terraform"]

options:
  logging: CLOUD_LOGGING_ONLY
